name: Plugin package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Fetch verified official Dalamud references
        shell: pwsh
        run: |
          ./scripts/Fetch-Dalamud.ps1
          "DALAMUD_HOME=$((Resolve-Path '.tools/dalamud').Path)" >> $env:GITHUB_ENV
      - name: Build and verify plugin ZIP
        shell: pwsh
        run: |
          dotnet restore src/AmorRP.Plugin/AmorRP.Plugin.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build src/AmorRP.Plugin/AmorRP.Plugin.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check-plugin-package.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AmorRP-M0-plugin
          path: src/AmorRP.Plugin/bin/x64/Release/AmorRP/latest.zip
          if-no-files-found: error
          retention-days: 30

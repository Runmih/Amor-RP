        re-login. Not the durable authentication contract. Disabled until XIVAuth is configured.
      security:
      - LoginAttempt: []
      responses:
        '200':
          description: Poll temporary login without session secrets
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAttemptStatus'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authorization-policy: LoginAttempt
      x-implementation-status: implemented
      parameters:
      - name: attemptId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /auth/xivauth/feasibility-callback:
    get:
      operationId: identityProbeCallback
      tags:
      - Feasibility
      summary: One-use PKCE feasibility callback
      description: M1 isolated, single-instance probe. State is memory-only and bounded; restart requires
        re-login. Not the durable authentication contract. Disabled until XIVAuth is configured.
      security: []
      responses:
        '200':
          description: One-use PKCE feasibility callback
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            text/html:
              schema:
                type: string
        '400':
          description: Invalid state or failed/expired login. No secrets returned.
          content:
            text/html:
              schema:
                type: string

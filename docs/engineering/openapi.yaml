openapi: 3.0.3
info:
  title: Amor RP proposed 1.0 API
  version: 1.0.0-draft
  description: Proposed 1.0 contract. M0 implements liveness, readiness and capabilities;
    M1 adds temporary identity feasibility probes. Durable authentication and product routes are planned. Defaults are provisional; decision register and API guide define rules.
servers:
- url: https://api.example.invalid
  description: Placeholder; configure real trusted backend URL.
tags:
- name: Service
- name: Authentication
- name: Character
- name: Groups
- name: Membership
- name: Invitations
- name: Ownership
- name: Currency
- name: Categories
- name: Definitions
- name: Inventory
- name: Trading
- name: History
- name: Recovery
- name: Data lifecycle
- name: Events
paths:

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          headers:
            ETag:
              schema:
                type: string
              description: Resource concurrency token where versioned.
      x-authorization-policy: Public
      x-implementation-status: implemented
  /health/ready:
    get:

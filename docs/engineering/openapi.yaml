        description: Fresh UUIDv7 (at most ten minutes old). Same key and secret retry credential bind
          probe replay.
components:
  securitySchemes:
    Session:
      type: http
      scheme: bearer
      description: Opaque character-bound access credential.
    LoginStart:
      type: apiKey
      in: header
      name: X-Login-Request-Credential
      description: Client-generated 256-bit random secret for this login start/retry only. Does not authenticate
        a character.
    LoginAttempt:
      type: apiKey
      in: header
      name: X-Login-Attempt-Credential
      description: Secret bound to one short-lived attempt; not a session.
  responses:
    Problem:
      description: RFC 9457-style error; see code/status conventions in API guide.
      headers:
        Retry-After:
          schema:
            type: string
          description: Present for rate limit/service unavailable when appropriate.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title: &id003
          type: string
          description: Plain text; named service limits and Unicode text-element checks also apply.
        status:
          type: integer
          format: int32
        detail: *id003
        code: *id003
        requestId: *id003
        errors:
          type: object
          additionalProperties:
            type: array
            items: *id003
      required:
      - type
      - title
      - status
      - code
      - requestId
      additionalProperties: true
    Character:
      type: object
      properties:
        id: *id002
        displayName: &id004
          type: string
          minLength: 1
          maxLength: 80
        homeWorldId:
          type: string
        homeWorldName: *id004
        verifiedAt: &id006
          type: string
          format: date-time
        status:
          type: string
          enum:
          - active
          - deletion_pending
      required:
      - id
      - displayName
      - homeWorldId
      - homeWorldName
      - verifiedAt
      - status
      additionalProperties: true
    PublicLimits:
      type: object
      properties:
        ownedGroups:
          type: integer
          format: int32
          minimum: 1
        joinedGroups:
          type: integer
          format: int32
          minimum: 1
        defaultLettersPerWeek:
          type: integer
          format: int32
          minimum: 0
        defaultPotionPoints:
          type: integer
          format: int32
          minimum: 0
        chatMessageTextElements:
          type: integer
          format: int32
          minimum: 1
        letterTitleTextElements:
          type: integer
          format: int32
          minimum: 1
        letterBodyTextElements:
          type: integer
          format: int32
          minimum: 1
        maxPageSize:
          type: integer
          format: int32
          minimum: 1
        maxHoldingsPerCharacterGroup:
          type: integer
          format: int32
          minimum: 1
        maxTradeLinesPerSide:
          type: integer
          format: int32
          minimum: 1
        maxCreationQuantity:
          type: integer
          format: int32
          minimum: 1
        tradeLifetimeSeconds:
          type: integer
          format: int32
          minimum: 1
        resetWeekdayUtc:
          type: string
        resetTimeUtc:
          type: string
        maxRequestBytes:
          type: integer
          format: int32
          minimum: 1
      required:
      - ownedGroups
      - joinedGroups
      - defaultLettersPerWeek
      - defaultPotionPoints
      - chatMessageTextElements
      - letterTitleTextElements
      - letterBodyTextElements
      - maxPageSize
      - maxHoldingsPerCharacterGroup
      - maxTradeLinesPerSide
      - maxCreationQuantity
      - tradeLifetimeSeconds
      - resetWeekdayUtc
      - resetTimeUtc
      - maxRequestBytes
      additionalProperties: true
    ItemTypeInfo:
      type: object
      properties:
        id: *id003
        typeDataVersion: *id005
        canUse: *id001
        stackable: *id001
      required:
      - id
      - typeDataVersion
      - canUse
      - stackable
      additionalProperties: true
    Capabilities:
      type: object
      properties:
        apiVersion:
          type: string
        serverVersion:
          type: string
        minimumClientVersion:
          type: string
        maintenance: *id001
        message: *id003
        supportedTypes:
          type: array
          items:
            $ref: '#/components/schemas/ItemTypeInfo'
        grantableCapabilities:
          type: array
          items:
            type: string
        chatDestinationKinds:
          type: array
          items:
            type: string
        limits:
          $ref: '#/components/schemas/PublicLimits'
      required:
      - apiVersion
      - serverVersion
      - minimumClientVersion
      - maintenance
      - message
      - supportedTypes
      - grantableCapabilities
      - chatDestinationKinds
      - limits
      additionalProperties: true
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - unavailable
      required:
      - status
      additionalProperties: true
    LoginStart:
      type: object
      properties:
        displayName: *id004
        homeWorldId:
          type: string
          minLength: 1
      required:
      - displayName
      - homeWorldId
      additionalProperties: false
    LoginAttemptCreated:
      type: object
      properties:
        attemptId: *id002
        authorizationUrl:
          type: string
          format: uri
        attemptCredential:
          type: string
          description: 'Secret: header only after creation, never logged.'
        expiresAt: *id006
        pollIntervalSeconds:
          type: integer
          format: int32
          minimum: 1
      required:
      - attemptId
      - authorizationUrl
      - attemptCredential
      - expiresAt
      - pollIntervalSeconds
      additionalProperties: true
    LoginAttemptStatus:
      type: object
      properties:
        attemptId: *id002
        status:
          type: string
          enum:
          - pending
          - verified
          - failed
          - cancelled
          - expired
        expiresAt: *id006
        failureCode:
          type: string
          nullable: true
      required:
      - attemptId
      - status
      - expiresAt
      - failureCode
      additionalProperties: true
      description: No session credentials in status response.
    SessionTokens:
      type: object
      properties:
        sessionId: *id002
        character:
          $ref: '#/components/schemas/Character'
        accessToken:
          type: string
        accessExpiresAt: *id006
        refreshToken:
          type: string
        refreshExpiresAt: *id006
      required:
      - sessionId
      - character
      - accessToken
      - accessExpiresAt
      - refreshToken
      - refreshExpiresAt
      additionalProperties: true
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
      - refreshToken
      additionalProperties: false
    SessionInfo:
      type: object
      properties:
        id: *id002
        createdAt: *id006
        lastUsedAt: *id006
        expiresAt: *id006
        isCurrent: *id001
      required:
      - id
      - createdAt
      - lastUsedAt
      - expiresAt
      - isCurrent
      additionalProperties: true
    Currency:
      type: object
      properties:
        id: *id002
        groupId: *id002
        name: *id004
        symbol:
          type: string
          maxLength: 16
        version: *id005
      required:
      - id
      - groupId
      - name
      - symbol
      - version
      additionalProperties: true
    Balance:
      type: object
      properties:
        currencyId: *id002
        characterId: *id002
        owned: &id007
          type: string
          description: Nonnegative whole units, within signed 64-bit range.
          pattern: ^(0|[1-9][0-9]*)$
          maxLength: 19
        reserved: *id007
        available: *id007
        version: *id005
      required:
      - currencyId
      - characterId
      - owned
      - reserved
      - available
      - version
      additionalProperties: true
    CurrencyEdit:
      type: object
      properties:
        name: *id004
        symbol:
          type: string
          maxLength: 16
      required:
      - name
      - symbol
      additionalProperties: false
    CurrencyAdjustment:
      type: object
      properties:
        targetCharacterId: *id002
        delta:
          type: string
          description: Nonzero signed whole units, checked against signed 64-bit range.
          pattern: ^-?[1-9][0-9]*$
          maxLength: 20
        reason: &id008
          type: string
          minLength: 1
          maxLength: 500
      required:
      - targetCharacterId
      - delta
      - reason
      additionalProperties: false
    Group:
      type: object
      properties:
        id: *id002
        name: *id004
        description: *id003
        ownerCharacterId: *id002
        version: *id005
        currency:
          $ref: '#/components/schemas/Currency'
        myCapabilities:
          type: array
          items:
            type: string
        myTradingRestricted: *id001
        myBalance:
          $ref: '#/components/schemas/Balance'
        pendingOwnershipTransferId:
          type: string
          format: uuid
          nullable: true
      required:
      - id
      - name
      - description
      - ownerCharacterId
      - version
      - currency
      - myCapabilities
      - myTradingRestricted
      - myBalance
      - pendingOwnershipTransferId
      additionalProperties: true
    GroupCreate:
      type: object
      properties:
        name: *id004
        description:
          type: string
          maxLength: 2000
        currencyName: *id004
        currencySymbol:
          type: string
          maxLength: 16
        weeklyPotionPoints:
          type: integer
          format: int32
          minimum: 0
        weeklyLetters:
          type: integer
          format: int32
          minimum: 0
          default: 5
      required:
      - name
      - description
      - currencyName
      - currencySymbol
      - weeklyPotionPoints
      - weeklyLetters
      additionalProperties: false
    GroupEdit:
      type: object
      properties:
        name: *id004
        description:
          type: string
          maxLength: 2000
      required:
      - name
      - description
      additionalProperties: false
    GroupDeletion:
      type: object
      properties:
        confirmName: *id004
      required:
      - confirmName
      additionalProperties: false
    JoinGroup:
      type: object
      properties:
        invitationCode:
          type: string
          minLength: 1
        acceptMemberVisibility:
          type: boolean
          enum:
          - true
      required:
      - invitationCode
      - acceptMemberVisibility
      additionalProperties: false
    PolicyValues:
      type: object
      properties:
        potionPoints:
          type: integer
          format: int32
          minimum: 0
        letters:
          type: integer
          format: int32
          minimum: 0
      required:
      - potionPoints
      - letters
      additionalProperties: true
    GroupPolicies:
      type: object
      properties:
        groupId: *id002
        version: *id005
        currentPeriodStart: *id006
        nextResetAt: *id006
        current:
          $ref: '#/components/schemas/PolicyValues'
        next:
          $ref: '#/components/schemas/PolicyValues'
      required:
      - groupId
      - version
      - currentPeriodStart
      - nextResetAt
      - current
      - next
      additionalProperties: true
    PolicyEdit:
      type: object
      properties:
        potionPoints:
          type: integer
          format: int32
          minimum: 0
        letters:
          type: integer
          format: int32
          minimum: 0
      required:
      - potionPoints
      - letters
      additionalProperties: false
      description: Schedules values for next server weekly period; no client-selected effective date.
    Member:
      type: object
      properties:
        character:
          $ref: '#/components/schemas/Character'
        status:
          type: string
          enum:
          - active
          - dormant
          - blocked
        isOwner: *id001
        capabilities:
          type: array
          items:
            type: string
        tradingRestricted: *id001
        version: *id005
        etag:
          type: string
          description: Server-supplied member concurrency token, also available in roster rows.
      required:
      - character
      - status
      - isOwner
      - capabilities
      - tradingRestricted
      - version
      - etag
      additionalProperties: true
    MemberCapabilities:
      type: object
      properties:
        capabilities:
          type: array
          items:
            type: string
            description: Only server-discovered grantable action IDs.
      required:
      - capabilities
      additionalProperties: false
    MemberRestriction:
      type: object
      properties:
        restricted: *id001
        reason:
          type: string
          maxLength: 500
      required:
      - restricted
      - reason
      additionalProperties: false
    MemberRemoval:
      type: object
      properties:
        reason: *id008
      required:
      - reason
      additionalProperties: false
    InvitationCreate:
      type: object
      properties:
        expiresInHours:
          type: integer
          format: int32
          minimum: 1
          maximum: 168
        maxUses:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
      required:
      - expiresInHours
      - maxUses
      additionalProperties: false
    Invitation:
      type: object
      properties:
        id: *id002
        groupId: *id002
        expiresAt: *id006
        maxUses:
          type: integer
          format: int32
        used:
          type: integer
          format: int32
        revoked: *id001
      required:
      - id
      - groupId
      - expiresAt
      - maxUses
      - used
      - revoked
      additionalProperties: true
    InvitationCreated:
      type: object
      properties:
        invitation:
          $ref: '#/components/schemas/Invitation'
        invitationCode:
          type: string
          description: Secret returned once; stored as hash.
      required:
      - invitation
      - invitationCode
      additionalProperties: true
    OwnershipProposal:
      type: object
      properties:
        recipientCharacterId: *id002
      required:
      - recipientCharacterId
      additionalProperties: false
    OwnershipTransfer:
      type: object
      properties:
        id: *id002
        groupId: *id002
        fromCharacterId: *id002
        toCharacterId: *id002
        status:
          type: string
          enum:
          - proposed
          - accepted
          - cancelled
          - expired
        expiresAt: *id006
      required:
      - id
      - groupId
      - fromCharacterId
      - toCharacterId
      - status
      - expiresAt
      additionalProperties: true
    Category:
      type: object
      properties:
        id: *id002
        groupId: *id002
        name: *id004
        allowedTypeIds:
          type: array
          items:
            type: string
        retired: *id001
        version: *id005
      required:
      - id
      - groupId
      - name
      - allowedTypeIds
      - retired
      - version
      additionalProperties: true
    CategoryEdit:
      type: object
      properties:
        name: *id004
        allowedTypeIds:
          type: array
          items:
            type: string
      required:
      - name
      - allowedTypeIds
      additionalProperties: false
    PotionData:
      type: object
      properties:
        creationCost:
          type: integer
          format: int32
          minimum: 1
        useMessage:
          type: string
          description: Literal message. Server enforces discovered 50-text-element default and tested
            game byte cap.
      required:
      - creationCost
      - useMessage
      additionalProperties: true
    Definition:
      type: object
      properties:
        id: *id002
        groupId: *id002
        typeId:
          type: string
        revision: *id005
        typeDataVersion: *id005
        name: *id004
        categoryId: *id002
        description: *id003
        enabled: *id001
        retired: *id001
        potion:
          $ref: '#/components/schemas/PotionData'
      required:
      - id
      - groupId
      - typeId
      - revision
      - typeDataVersion
      - name
      - categoryId
      - description
      - enabled
      - retired
      - potion
      additionalProperties: true
      description: 1.0 has owner-authored potion definitions; other future types use versioned typed payloads.
    PotionDataWrite:
      type: object
      properties:
        creationCost:
          type: integer
          format: int32
